<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="Pointer PPT - Kendalikan presentasi dari HP Anda menggunakan touchpad atau gyroscope.">
    <meta name="theme-color" content="#080c14">
    <title>Pointer PPT</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <main class="shell" role="main">
        <div class="card">

            <header class="card-header">
                <h1 class="title">Pointer PPT</h1>
                <p id="status-text" class="status" aria-live="polite" aria-atomic="true">Menghubungkan...</p>
            </header>

            <section aria-label="Pilihan mode input">
                <div class="segment" role="group" aria-label="Mode Input">
                    <button type="button" class="seg-btn active" id="btn-mode-touch" aria-pressed="true">Touchpad</button>
                    <button type="button" class="seg-btn" id="btn-mode-gyro" aria-pressed="false">Gyroscope</button>
                </div>
            </section>

            <section aria-label="Mode laser pointer">
                <p class="label">Mode Laser</p>
                <div class="laser-row">
                    <button type="button" class="laser-btn" id="btn-laser-ppt" aria-pressed="false">
                        <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
                        PPT
                    </button>
                    <button type="button" class="laser-btn" id="btn-laser-global" aria-pressed="false">
                        <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
                        Global
                    </button>
                </div>
            </section>

            <!-- Area Touchpad -->
            <div class="touch-area" id="touchpad-area" role="application" aria-label="Area touchpad. Geser 1 jari untuk kursor. 2-jari untuk scroll. Ketuk sekali klik kiri. Dua ketuk klik kanan.">
                <span class="touch-hint">Geser 1-jari · 2-jari untuk scroll</span>
                <span class="touch-sub">Ketuk 1x Klik Kiri &middot; Ketuk 2x Klik Kanan</span>
            </div>

            <!-- Area Gyroscope -->
            <div class="gyro-area" id="gyro-area" aria-hidden="true">
                <svg aria-hidden="true" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 2a10 10 0 1 0 0 20"/><path d="M12 2c-4 4-4 12 0 20M12 2c4 4 4 12 0 20"/><line x1="2" y1="12" x2="22" y2="12"/></svg>
                <span>Gyroscope Aktif</span>
                <button type="button" class="recenter-btn" id="btn-recenter">Bidik Tengah</button>
            </div>

            <!-- Kontrol Universal -->
            <section class="controls" aria-label="Kontrol presentasi">
                <div class="ctrl-row">
                    <button type="button" class="ctrl-btn" id="btn-click-left" aria-label="Klik kiri">Klik Kiri</button>
                    <button type="button" class="ctrl-btn" id="btn-click-right" aria-label="Klik kanan">Klik Kanan</button>
                </div>
                <div class="ctrl-row">
                    <button type="button" class="ctrl-btn nav-btn" id="btn-prev" aria-label="Slide sebelumnya">
                        <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>
                        Prev
                    </button>
                    <button type="button" class="ctrl-btn nav-btn" id="btn-next" aria-label="Slide berikutnya">
                        Next
                        <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg>
                    </button>
                </div>
                <div class="ctrl-row">
                    <button type="button" class="ctrl-btn" id="btn-esc" aria-label="Tekan Esc">Esc</button>
                    <button type="button" class="ctrl-btn accent-btn" id="btn-f5" aria-label="Mulai presentasi (F5)">Mulai (F5)</button>
                </div>
            </section>

        </div>
    </main>

    <script src="https://cdn.socket.io/4.6.1/socket.io.min.js"></script>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
